server:
  port: ${PORT:8080}

spring:
  application:
    name: procucev-speech-to-text
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:speech_to_text}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Speech-to-Text Recognition Settings
speech:
  # Provider options: deepgram, mock, whisper
  provider: ${SPEECH_PROVIDER:deepgram}
  deepgram:
    api-key: ${DEEPGRAM_API_KEY:}
    model: ${DEEPGRAM_MODEL:nova-2}
    language: ${DEEPGRAM_LANGUAGE:hi}
    detect-language: ${DEEPGRAM_DETECT_LANGUAGE:true}
    smart-format: true
    endpointing: 300
    interim-results: true
  gemini:
    api-key: ${GEMINI_API_KEY:}
  whisper:
    websocket-url: ${WHISPER_WS_URL:ws://localhost:9090}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
